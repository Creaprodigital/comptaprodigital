# =============================================================================
# ComptaPro Digital — production (VPS Ubuntu)
#   docker compose up -d                 # application, base de données, HTTPS
#   docker compose run --rm migrate      # migrations + données de référence
#   docker compose run --rm jobs         # tâches quotidiennes (récurrence, relances)
# Les secrets sont lus dans le fichier .env (jamais versionné).
# =============================================================================
name: comptapro

services:
  app:
    image: ${APP_IMAGE:-comptapro:latest}
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${APP_URL}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    networks: [internal]

  migrate:
    image: ${APP_TOOLS_IMAGE:-comptapro-tools:latest}
    build:
      context: .
      target: tools
    profiles: [tools]
    env_file: .env
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  # Tâches quotidiennes : factures récurrentes, relances automatiques, purges.
  #   docker compose run --rm jobs        (à planifier une fois par jour avec cron)
  jobs:
    image: ${APP_TOOLS_IMAGE:-comptapro-tools:latest}
    build:
      context: .
      target: tools
    profiles: [tools]
    command: ["npx", "tsx", "scripts/run-jobs.ts"]
    env_file: .env
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    # La base n'est jamais exposée sur Internet : réseau interne, et boucle locale
    # du serveur uniquement (utilisée par les scripts de sauvegarde).
    ports:
      - "127.0.0.1:3306:3306"
    networks: [internal]

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [internal]

volumes:
  db_data:
  caddy_data:
  caddy_config:

networks:
  internal:
