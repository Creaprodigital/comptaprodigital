# =============================================================================
# Services de développement local (Windows, macOS, Linux) :
#   docker compose -f docker-compose.dev.yml up -d
#   - MySQL 8      → localhost:3306 (utilisateur comptapro / comptapro_dev)
#   - Mailpit      → SMTP localhost:1025, boîte de réception http://localhost:8025
# L'application elle-même se lance avec « npm run dev ».
# =============================================================================
name: comptapro-dev

services:
  db:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_dev
      MYSQL_DATABASE: comptapro
      MYSQL_USER: comptapro
      MYSQL_PASSWORD: comptapro_dev
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - dev_db_data:/var/lib/mysql
      - ./docker/mysql-dev-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot_dev --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  dev_db_data:
