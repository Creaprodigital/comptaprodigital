name: Déploiement

# Déploiement manuel, ou automatique à la publication d'une étiquette vX.Y.Z.
# Secrets à définir dans GitHub (Settings → Secrets and variables → Actions) :
#   VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PORT (facultatif)
# Variable (Settings → Variables) : APP_URL (ex. https://app.votre-domaine.fr)
on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: deploiement-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Construction et publication des images
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Nom d'image en minuscules
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image applicative
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.APP_URL }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image d'outils (migrations)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tools
          push: true
          tags: |
            ${{ env.IMAGE }}-tools:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}-tools:latest
          cache-from: type=gha

  deploiement:
    name: Mise en production sur le VPS
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Nom d'image en minuscules
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      - name: Déploiement par SSH
        uses: appleboy/ssh-action@v1
        env:
          APP_IMAGE: ${{ env.IMAGE }}:${{ needs.image.outputs.tag }}
          APP_TOOLS_IMAGE: ${{ env.IMAGE }}-tools:${{ needs.image.outputs.tag }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: APP_IMAGE,APP_TOOLS_IMAGE
          script: |
            set -euo pipefail
            cd /opt/comptapro
            export APP_IMAGE APP_TOOLS_IMAGE
            docker compose pull app migrate check
            # Sauvegarde chiffrée avant toute migration (voir docs/DEPLOIEMENT-HOSTINGER.md).
            set -a; . ./backup.env; set +a
            ./scripts/backup-db.sh
            docker compose run --rm migrate
            docker compose up -d --no-build app proxy
            docker image prune -f
            # Vérification : l'application répond et accède à la base.
            for i in $(seq 1 20); do
              if docker compose exec -T app node -e "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                echo "Application en ligne."
                # Contrôle complet de l'installation (configuration, migrations, services externes).
                docker compose run --rm check
                exit 0
              fi
              sleep 3
            done
            docker compose logs --tail 80 app
            exit 1
